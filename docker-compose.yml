name: rootkit

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: rootkit
      POSTGRES_PASSWORD: rootkit
      POSTGRES_DB: rootkit
    ports:
      - "5433:5432"  # 로컬 Homebrew Postgres(5432)와 충돌 방지
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rootkit -d rootkit"]
      interval: 5s
      timeout: 3s
      retries: 10

  agent:
    build: ./rookit-agent
    restart: unless-stopped
    env_file:
      - path: ./rookit-agent/.env
        required: false
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./rookit-agent/runtime:/app/runtime
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build:
      context: ./web
      target: migrator
    environment:
      DATABASE_URL: postgres://rootkit:rootkit@db:5432/rootkit
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  web:
    build:
      context: ./web
      target: runner
    # JWT_SECRET 등 비밀값은 web/.env에서 읽는다
    env_file: ./web/.env
    # 컨테이너 내부 주소는 .env(로컬 개발용) 값을 덮어쓴다
    environment:
      DATABASE_URL: postgres://rootkit:rootkit@db:5432/rootkit
      AI_API_BASE_URL: http://agent:8000
    ports:
      - "3000:3000"
    depends_on:
      agent:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  pgdata:
